<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galaxia 3D para Estefanía</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas {
      display: block;
    }
    .instructions {
      position: absolute;
      bottom: 25px;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.85);
      font-size: 15px;
      pointer-events: none;
      letter-spacing: 1.5px;
      text-shadow: 0 0 12px rgba(255, 100, 200, 0.9);
      z-index: 10;
    }
  </style>
</head>
<body>

<div class="instructions">Arrastra para explorar el espacio 3D • Haz zoom para revelar el mensaje ✨</div>

<!-- Three.js y OrbitControls esenciales -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
  // 1. Escena, Cámara y Renderizador
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x000005, 0.001);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
  camera.position.set(0, 160, 420);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.04;
  controls.maxDistance = 800;
  controls.minDistance = 40;

  // 2. Galaxia 3D con Puntos Limpios
  const particleCount = 8000;
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount * 3);
  const colors = new Float32Array(particleCount * 3);

  const colorInside = new THREE.Color('#ffbbee');
  const colorOutside = new THREE.Color('#3366ff');

  for (let i = 0; i < particleCount; i++) {
    const i3 = i * 3;
    const radius = Math.random() * 320;
    const spinAngle = radius * 0.015;
    const branchAngle = ((i % 3) * Math.PI * 2) / 3;
    
    const randomX = (Math.random() - 0.5) * 40 * (1 - radius / 320);
    const randomY = (Math.random() - 0.5) * 30 * (1 - radius / 320);
    const randomZ = (Math.random() - 0.5) * 40 * (1 - radius / 320);

    positions[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
    positions[i3 + 1] = randomY;
    positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

    const mixedColor = colorInside.clone();
    mixedColor.lerp(colorOutside, radius / 320);
    
    colors[i3] = mixedColor.r;
    colors[i3 + 1] = mixedColor.g;
    colors[i3 + 2] = mixedColor.b;
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const particleMaterial = new THREE.PointsMaterial({
    size: 3.5,
    sizeAttenuation: true,
    vertexColors: true,
    transparent: true,
    opacity: 0.9,
    blending: THREE.AdditiveBlending
  });

  const galaxyPoints = new THREE.Points(geometry, particleMaterial);
  scene.add(galaxyPoints);

  // 3. Núcleo central brillante
  const coreGeo = new THREE.SphereGeometry(16, 32, 32);
  const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const coreMesh = new THREE.Mesh(coreGeo, coreMat);
  scene.add(coreMesh);

  // 4. Anillos con Texto Directo en 3D (Textura Segua)
  function createTextRing(text, radius) {
    const canvas = document.createElement('canvas');
    canvas.width = 2048;
    canvas.height = 128;
    const context = canvas.getContext('2d');

    context.font = 'bold 42px "Segoe UI", sans-serif';
    context.fillStyle = '#ffb3de';
    context.textAlign = 'center';
    context.textBaseline = 'middle';
    
    const fullText = (text + "   •   ").repeat(3);
    context.fillText(fullText, canvas.width / 2, canvas.height / 2);

    const texture = new THREE.CanvasTexture(canvas);
    const ringGeo = new THREE.RingGeometry(radius - 6, radius + 6, 64);
    const ringMat = new THREE.MeshBasicMaterial({
      map: texture,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
    ringMesh.rotation.x = Math.PI / 2;
    scene.add(ringMesh);
    return ringMesh;
  }

  const messageText = "MI AMOR POR TI ES MAS QUE UNA GALAXIA INFINITA";
  const rings = [
    createTextRing(messageText, 130),
    createTextRing(messageText, 210),
    createTextRing(messageText, 290]
  );

  // Redimensionado de pantalla
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // 5. Bucle de Animación
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const elapsedTime = clock.getElapsedTime();

    galaxyPoints.rotation.y = elapsedTime * 0.04;
    coreMesh.rotation.y = elapsedTime * 0.08;

    // Aparición de los anillos al hacer zoom
    const distToCenter = camera.position.length();
    let targetOpacity = 0;
    if (distToCenter < 290) {
      targetOpacity = Math.min(Math.max((290 - distToCenter) / 140, 0), 1);
    }

    rings.forEach((ring, index) => {
      ring.rotation.z = elapsedTime * (index % 2 === 0 ? 0.02 : -0.02);
      ring.material.opacity += (targetOpacity - ring.material.opacity) * 0.1;
    });

    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>

</body>
</html>
